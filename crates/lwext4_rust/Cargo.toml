[package]
name = "lwext4_rust"
authors = ["Luoyuan Xiao <xiaoluoyuan@163.com>"]
version = "0.2.0"
edition = "2018"
license = "GPL-2.0"
repository = "https://github.com/elliott10/lwext4_rust"
description = "lwext4 in Rust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

links = "lwext4"
build = "build.rs"

[features]
default = ["print"]
print = ["printf-compat"]
# Exposes aggregate write-back-cache counters to the kernel's perf report.
# The build script forwards this to CMake so ordinary release kernels do not
# compile the C-side hooks, atomics, or telemetry storage.
perf = []
# Opt-in P21.2b.2 dirty bcache high/low-watermark experiment. The build script
# uses an archive name and CMake build directory distinct from the default.
bcache-dirty-capacity-experiment = []

[dependencies]
log = "0.4"
printf-compat = { version = "0.1", default-features = false, optional = true }
spin = "0.9.8"
hashbrown = "0.12.0"

#[build-dependencies]
#[target.'cfg(unix)'.build-dependencies]
#bindgen = "0.69"
